<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments System</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --border: #e8e4df;
    --text: #1a1714;
    --muted: #8c8480;
    --accent: #c0392b;
    --accent-hover: #a93226;
    --reply-bg: #f9f8f6;
    --avatar-bg: #2c2825;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 40px 20px;
    color: var(--text);
  }

  .comment-section {
    max-width: 680px;
    margin: auto;
  }

  h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 24px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  /* INPUT CARD */
  .comment-input-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
  }

  .comment-input-box input,
  .comment-input-box textarea {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.2s;
    resize: vertical;
  }

  .comment-input-box input:focus,
  .comment-input-box textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .comment-input-box textarea { min-height: 80px; }

  /* BUTTON */
  button {
    width: fit-content;
    padding: 9px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.2px;
  }

  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.97); }

  /* STATUS */
  .status {
    font-size: 13px;
    color: var(--muted);
    padding: 10px 0;
    text-align: center;
  }
  .status.error { color: var(--accent); }

  /* COMMENT CARD */
  .comment-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* COMMENT ROW */
  .comment {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  /* AVATAR */
  .avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: var(--avatar-bg);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
  }

  /* BODY */
  .comment-body { flex: 1; min-width: 0; }

  .comment-header {
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .comment-time {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  .comment-text {
    font-size: 14px;
    margin-top: 4px;
    line-height: 1.55;
    color: var(--text);
  }

  .actions {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    display: flex;
    gap: 12px;
  }

  .actions span {
    cursor: pointer;
    transition: color 0.15s;
    font-weight: 500;
  }

  .actions span:hover { color: var(--accent); }

  /* REPLIES */
  .replies {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .reply-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding-left: 8px;
    border-left: 2px solid var(--border);
  }

  .reply-item .avatar {
    width: 28px;
    height: 28px;
    min-width: 28px;
    font-size: 11px;
    background: #5a4e47;
  }

  /* Deeper nesting: tighter left border */
  .reply-item .replies {
    border-left: 2px solid #ede9e4;
    padding-left: 6px;
    margin-left: 2px;
  }

  /* REPLY INPUT BOX */
  .reply-box {
    margin-top: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
    background: var(--reply-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }

  .reply-box input,
  .reply-box textarea {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    resize: vertical;
    transition: border-color 0.2s;
  }

  .reply-box input:focus,
  .reply-box textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .reply-box textarea { min-height: 60px; }
  .reply-box button { font-size: 12px; padding: 7px 14px; }
</style>
</head>

<body>

<div class="comment-section">

  <h2>Comments</h2>

  <div class="comment-input-box">
    <input id="name" placeholder="Your name" maxlength="60">
    <textarea id="message" placeholder="Add a comment..." rows="3" maxlength="1000"></textarea>
    <button onclick="addComment()">Post Comment</button>
  </div>

  <div id="status" class="status" style="display:none;"></div>
  <div id="comments"></div>

</div>

<script type="module">

import { createClient }
  from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://pojmeeozeuzqtgrvwgxw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvam1lZW96ZXV6cXRncnZ3Z3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODM2MjYsImV4cCI6MjA5NTQ1OTYyNn0.c9sgwAH8ysgayh_dvk_uzNTK5XuUZ1k57Lk_cfzlhbA"
);

const postId = "blog-1";

/* ── HELPERS ── */
function escapeHTML(str) {
  return (str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function timeAgo(date) {
  const diff = Math.floor((Date.now() - new Date(date)) / 1000);
  if (diff < 60)    return diff + "s ago";
  if (diff < 3600)  return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
}

function setStatus(msg, isError = false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (isError ? " error" : "");
  el.style.display = msg ? "block" : "none";
}

/* ── ADD TOP-LEVEL COMMENT ── */
window.addComment = async function () {
  const name    = document.getElementById("name").value.trim();
  const message = document.getElementById("message").value.trim();

  if (!name || !message) { setStatus("Please fill in your name and comment.", true); return; }

  setStatus("Posting…");
  const { error } = await supabase.from("comments").insert([{
    name, message, post_id: postId, parent_id: null
  }]);

  if (error) { setStatus("Failed to post: " + error.message, true); return; }

  document.getElementById("message").value = "";
  setStatus("");
  loadComments();
};

/* ── TOGGLE REPLY BOX ── */
window.showReplyBox = function (id) {
  const el = document.getElementById(`reply-box-${id}`);
  if (!el) return;
  el.style.display = el.style.display === "flex" ? "none" : "flex";
};

/* ── ADD REPLY (any depth) ── */
window.addReply = async function (parentId) {
  const nameEl = document.getElementById(`reply-name-${parentId}`);
  const msgEl  = document.getElementById(`reply-input-${parentId}`);

  const name    = nameEl?.value.trim();
  const message = msgEl?.value.trim();

  if (!name || !message) { alert("Please fill in your name and reply."); return; }

  const { error } = await supabase.from("comments").insert([{
    name, message, post_id: postId, parent_id: parentId
  }]);

  if (error) { alert("Failed to reply: " + error.message); return; }

  loadComments();
};

/* ── BUILD REPLY INPUT HTML ── */
function replyBoxHTML(id) {
  return `
    <div class="reply-box" id="reply-box-${id}">
      <input  id="reply-name-${id}"  placeholder="Your name"      maxlength="60">
      <textarea id="reply-input-${id}" placeholder="Write a reply…" rows="2" maxlength="500"></textarea>
      <button onclick="addReply(${id})">Reply</button>
    </div>
  `;
}

/* ── RECURSIVE RENDER ── */
function renderComments(list, parentId = null, depth = 0) {
  const children = list.filter(c => c.parent_id === parentId);
  if (!children.length) return "";

  const isReply = depth > 0;
  const tag     = isReply ? "reply-item" : "comment";

  return children.map(c => {
    const nested = renderComments(list, c.id, depth + 1);

    return `
      <div class="${tag}">
        <div class="avatar">${(c.name || "U").charAt(0).toUpperCase()}</div>
        <div class="comment-body">
          <div class="comment-header">
            ${escapeHTML(c.name)}
            <span class="comment-time">${timeAgo(c.created_at)}</span>
          </div>
          <div class="comment-text">${escapeHTML(c.message)}</div>
          <div class="actions">
            <span onclick="showReplyBox(${c.id})">↩ Reply</span>
          </div>
          ${replyBoxHTML(c.id)}
          ${nested ? `<div class="replies">${nested}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

/* ── LOAD ALL COMMENTS ── */
async function loadComments() {
  const box = document.getElementById("comments");

  const { data, error } = await supabase
    .from("comments")
    .select("*")
    .eq("post_id", postId)
    .order("created_at", { ascending: true });

  if (error) {
    setStatus("Could not load comments. " + error.message, true);
    return;
  }

  const all = data || [];

  if (!all.length) {
    box.innerHTML = `<div class="status">No comments yet. Be the first!</div>`;
    return;
  }

  // Wrap top-level comments in cards
  const topLevel = all.filter(c => !c.parent_id);
  box.innerHTML = topLevel.map(c => {
    const nested = renderComments(all, c.id, 1);
    return `
      <div class="comment-card">
        <div class="comment">
          <div class="avatar">${(c.name || "U").charAt(0).toUpperCase()}</div>
          <div class="comment-body">
            <div class="comment-header">
              ${escapeHTML(c.name)}
              <span class="comment-time">${timeAgo(c.created_at)}</span>
            </div>
            <div class="comment-text">${escapeHTML(c.message)}</div>
            <div class="actions">
              <span onclick="showReplyBox(${c.id})">↩ Reply</span>
            </div>
            ${replyBoxHTML(c.id)}
            ${nested ? `<div class="replies">${nested}</div>` : ""}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

loadComments();

</script>
</body>
</html>
